<!-- kpi-card.component.html -->
<div class="kpi-card">

  <span class="kpi-card__icon">
    <p>Icono</p>
    <app-icon [name]="'info'" [size]="15" />
  </span>

  <span class="kpi-card__label">{{ label() }}</span>
  <span class="kpi-card__value" [class]="'kpi-card__value--' + tone()">{{ value() }}</span>
  @if (subtitle()) {
    <span class="kpi-card__subtitle">{{ subtitle() }}</span>
  }
</div>
