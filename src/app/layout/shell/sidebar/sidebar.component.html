<aside class="sidebar" aria-label="Navegación principal">
  <div class="sidebar__brand">
    <svg class="sidebar__brand-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/>
      <path d="M8 13l2.5-3 3 2L18 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="sidebar__brand-name">Inversiones</span>
  </div>

    <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
        <a
        class="sidebar__nav-item"
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-item--active"
        [ariaCurrentWhenActive]="'page'"
        >
        <span class="sidebar__nav-icon" aria-hidden="true">
          <app-icon [name]="item.icon" [size]="20" />
        </span>
        {{ item.label }}
        </a>
    }
    </nav>

  <div class="sidebar__footer">
    <div class="sidebar__utility">
      <button
        type="button"
        class="sidebar__icon-btn"
        [attr.aria-pressed]="balancesHidden()"
        [attr.aria-label]="balancesHidden() ? 'Mostrar saldos' : 'Ocultar saldos'"
        (click)="toggleBalancesVisibility()"
      >
        <span aria-hidden="true">
        @if(balancesHidden()){
          <app-icon [name]="'eye-off'" [size]="20" />
        }
        @else {
          <app-icon [name]="'eye'" [size]="20" />
        }
        </span>
      </button>

      <button
        type="button"
        class="sidebar__icon-btn"
        title="Tema oscuro fijo — no configurable"
        aria-label="Tema oscuro fijo"
      >
        <span aria-hidden="true">
          <app-icon [name]="'sun'" [size]="20" />
        </span>
      </button>
    </div>

    <div class="sidebar__user">
      <div class="sidebar__avatar" aria-hidden="true">👤</div>
      <span class="sidebar__username">Usuario Principal</span>
    </div>

    <button type="button" class="sidebar__logout" (click)="logout()">
      Cerrar sesión
    </button>
  </div>
</aside>
